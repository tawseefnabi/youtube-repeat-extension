<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Repeat</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>YouTube Repeat</h1>
      <label class="toggle">
        <input type="checkbox" id="loopToggle" />
        <span>Loop current video</span>
      </label>
      <p class="hint">Use the loop button in the player, or toggle here.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
